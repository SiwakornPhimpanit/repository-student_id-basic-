<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSU Coffee</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; font-family: system-ui, sans-serif; background: #f6f0e8; color: #322419; }
    main { max-width: 720px; margin: auto; padding: 32px; background: white; border-radius: 20px; }
    h1 { font-size: 2.5rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid #eee3d5; }
    a { display: inline-block; margin-top: 20px; padding: 12px 22px; border-radius: 10px; background: #5b3825; color: white; text-decoration: none; }
    a:hover { background: #774b32; }
    a:focus-visible { outline: 3px solid #c48436; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>KSU Coffee</h1>
    <p>นายศิวากร พิมพะนิตย์</p>
    <p>รหัสนักศึกษา: 671540006002-3 | กลุ่ม: CE6721</p>

    <h2>Menu v1</h2>
    <ul>
      <li><span>อเมริกาโน่เย็น</span><strong>45 บาท</strong></li>
      <li><span>ลาเต้เย็น</span><strong>55 บาท</strong></li>
      <li><span>คาปูชิโน่เย็น</span><strong>55 บาท</strong></li>
    </ul>

    <!-- ขั้นที่ 4 เปลี่ยนเป็น Menu v2 เพิ่มเมนู และนำ comment รอบลิงก์ออก -->
    <!-- <a href="http://localhost:8081">ดูโปรโมชั่น</a> -->
  </main>
</body>
</html>
